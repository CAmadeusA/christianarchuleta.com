name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Override BASE_HREF with a repository variable if your Pages site lives at a different base path.
  BASE_HREF: ${{ vars.BASE_HREF || '/' }}
  DIST_DIR: dist/personal-site/browser
  # Set CUSTOM_DOMAIN to create a CNAME file during deploy (e.g., "christianarchuleta.com").
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href ${BASE_HREF}

      - name: Add CNAME for custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: |
          echo "${CUSTOM_DOMAIN}" > "${DIST_DIR}/CNAME"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.DIST_DIR }}
          force_orphan: true
